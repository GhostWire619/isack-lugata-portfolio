name: Journal backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publishing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: journal_test
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journal -d journal_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOURNAL_ENV: development
      PUBLIC_URL: http://localhost:8001
      DATABASE_URL: postgresql://journal:test-only-password@localhost:5432/journal_test
      JOURNAL_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install journal dependencies
        run: pip install -r backend/requirements.lock
      - name: Check models and test PostgreSQL publishing and authentication
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test publishing --noinput
      - name: Verify the production Docker deployment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check_advertising.mjs
          node scripts/check_analytics.mjs
          unset JOURNAL_ENV PUBLIC_URL DATABASE_URL
          python scripts/setup_blog_env.py
          docker network create ecofy-network
          trap 'docker compose logs --tail=60; docker compose down -v; docker network rm ecofy-network' EXIT
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180 2>&1 | tee /tmp/full-stack-start.log
          if grep -Eqi 'pull access denied|repository does not exist' /tmp/full-stack-start.log; then exit 1; fi
          curl --fail --silent http://localhost:3100/ -o /tmp/portfolio.html
          grep -q 'Isack Lugata' /tmp/portfolio.html
          curl --fail --silent http://localhost:3100/ads.txt -o /tmp/ads.txt
          grep -qx 'google.com, pub-4911606730643023, DIRECT, f08c47fec0942fa0' /tmp/ads.txt
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/blog/ -o /tmp/journal.html
          grep -q 'A journal for' /tmp/journal.html
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/blog/privacy/ -o /tmp/privacy.html
          grep -q 'Privacy &amp; cookies' /tmp/privacy.html
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/blog/terms/ -o /tmp/terms.html
          grep -q 'Terms of use' /tmp/terms.html
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/blog/ai-writing-skill.md -o /tmp/writing-skill.md
          grep -q '^name: write-journal-articles$' /tmp/writing-skill.md
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/admin/login/ -o /tmp/login.html
          grep -q 'csrfmiddlewaretoken' /tmp/login.html
          test "$(curl --silent -o /tmp/mcp-auth.txt -w '%{http_code}' -X POST -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json' --data '{}' http://localhost:3100/mcp/)" = '401'
          grep -q 'access token is required' /tmp/mcp-auth.txt
          test "$(curl --silent -D /tmp/mcp-get-headers.txt -o /dev/null -w '%{http_code}' -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/mcp)" = '401'
          grep -qi 'WWW-Authenticate:.*resource_metadata=' /tmp/mcp-get-headers.txt
          curl --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' 'http://localhost:3100/admin/ai/authorize/?state=oauth-query-redaction-canary-93817' -o /dev/null
          docker compose logs --no-color portfolio journal > /tmp/access-log-redaction.txt
          if grep -q 'oauth-query-redaction-canary-93817' /tmp/access-log-redaction.txt; then exit 1; fi
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/.well-known/oauth-authorization-server -o /tmp/oauth.json
          python -c 'import json; d=json.load(open("/tmp/oauth.json")); assert d["authorization_endpoint"] == "https://isack.space/admin/ai/authorize/"; assert d["code_challenge_methods_supported"] == ["S256"]'
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/.well-known/oauth-protected-resource/mcp -o /tmp/mcp-resource.json
          python -c 'import json; assert json.load(open("/tmp/mcp-resource.json"))["resource"] == "https://isack.space/mcp"'
          test "$(curl --silent -o /tmp/event-auth.txt -w '%{http_code}' -X POST -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json' --data '{}' http://localhost:3100/events/)" = '403'
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/blog/feed/ -o /tmp/feed.xml
          grep -q '<rss' /tmp/feed.xml
          curl --fail --silent -H 'Host: isack.space' -H 'X-Forwarded-Proto: https' http://localhost:3100/sitemap.xml -o /tmp/sitemap.xml
          grep -q 'https://isack.space/blog/' /tmp/sitemap.xml
          test -z "$(docker port isack-journal-db)"
          docker inspect --format '{{json .NetworkSettings.Networks}}' isack-portfolio | grep 'ecofy-network'
