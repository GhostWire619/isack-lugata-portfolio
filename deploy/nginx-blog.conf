map $arg_v $portfolio_asset_cache {
    "" "public, max-age=0, must-revalidate";
    default "public, max-age=31536000, immutable";
}
map $http_x_forwarded_proto $journal_scheme {
    default $scheme;
    https https;
}
upstream journal_backend { server journal:8000; }
server {
    listen 3100;
    listen [::]:3100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/plain image/svg+xml;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /blog { return 301 /blog/; }
    location = /admin { return 301 /admin/; }
    location ~ ^/(blog/|admin/|security/|documents/|cms-static/|sitemap\.xml$) {
        proxy_pass http://journal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $journal_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 100s;
    }
    location /media/ {
        alias /var/www/journal-media/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location ~ ^/test-1(?:\.html)?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri.html =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control $portfolio_asset_cache;
        try_files $uri =404;
    }
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control $portfolio_asset_cache;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
