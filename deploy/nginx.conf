server {
    listen 3100;
    listen [::]:3100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Framer's pages use extensionless URLs, not an SPA fallback.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Nginx's standard MIME table does not consistently include .mjs.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
