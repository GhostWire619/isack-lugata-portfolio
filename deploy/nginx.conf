map $arg_v $portfolio_asset_cache {
    "" "public, max-age=0, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 3100;
    listen [::]:3100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/plain image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/test-1(?:\.html)?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri.html =404;
    }

    # Framer's pages use extensionless URLs, not an SPA fallback.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control $portfolio_asset_cache;
        try_files $uri =404;
    }

    # Nginx's standard MIME table does not consistently include .mjs.
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control $portfolio_asset_cache;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
